 # Events
 sd_events.1001.t:0 "Supreme Diplomat"
 sd_events.1001.desc:0 "Courts will listen. Prestige will speak. The realm others join without a siege begins with you."
 sd_events.1001.a:0 "Let them kneel."

 sd_events.1002.t:0 "Mantle Laid Down"
 sd_events.1002.desc:0 "You renounce the Supreme Diplomat mantle. Federation verbs sleep until embraced again."
 sd_events.1002.a:0 "So be it."

 sd_events.2001.t:0 "Vassalage Accepted"
 sd_events.2001.desc:0 "[recipient.GetShortUIName] kneels and keeps their titles under your protection."
 sd_events.2001.a:0 "Welcome."

 sd_events.2101.t:0 "Tributary Bound"
 sd_events.2101.desc:0 "[recipient.GetShortUIName] remains independent but pays tribute into your federation."
 sd_events.2101.a:0 "Gold will flow."

 sd_events.2201.t:0 "Alliance Sealed"
 sd_events.2201.desc:0 "The seal is set with [recipient.GetShortUIName]. No marriage grind required."
 sd_events.2201.a:0 "Together."

 sd_events.2202.t:0 "House Alliances Sealed"
 sd_events.2202.desc:0 "Your house seal packs alliances with eligible peers up to the intensity cap."
 sd_events.2202.a:0 "The house stands together."

 sd_events.2301.t:0 "Marriage Pact"
 sd_events.2301.desc:0 "A marriage pact with [recipient.GetShortUIName]'s house is sealed — alliance and lasting goodwill included."
 sd_events.2301.a:0 "Bound by blood and word."

 sd_events.2401.t:0 "Court Charmed"
 sd_events.2401.desc:0 "[recipient.GetShortUIName]'s court warms to your words. Charm, not fear."
 sd_events.2401.a:0 "Listen well."

 sd_events.2501.t:0 "Realm Invited"
 sd_events.2501.desc:0 "[recipient.GetShortUIName] brings their realm under your liege — vassal tree intact, no siege."
 sd_events.2501.a:0 "Join the empire."

 # Summit
 sd_summit.1001.t:0 "Court of Nations"
 sd_summit.1001.desc:0 "Envoys gather. Tribute accounts are read. Opportunities murmur in the gallery. No Tours required — this is your yearly embassy beat."
 sd_summit.1001.a:0 "Collect tribute splash"
 sd_summit.1001.b:0 "Court the opportunity"
 sd_summit.1001.c:0 "Host a bound guest"
 sd_summit.1001.d:0 "Dismiss the court"
 sd_summit.tt.tribute:0 "Collect bound tributary gold plus a modest summit splash"
 sd_summit.tt.opportunity:0 "Gain prestige and mild dynasty renown"
 sd_summit.tt.guest:0 "Charm a random bound client"
 sd_summit.tt.dismiss:0 "Close with a token of prestige"
