l_english:
 # Trait
 trait_sd_supreme_diplomat:0 "Supreme Diplomat"
 trait_sd_supreme_diplomat_desc:0 "Foreign courts kneel to charm and prestige. You offer vassalage, bind tributaries, seal alliances and marriage pacts, and grow a federation — without conquest CBs or hooks. Personal sheet stays below a Supreme Sovereign."

 # Intensity modifiers
 sd_diplo_low_modifier:0 "Diplomat Presence (Low)"
 sd_diplo_low_modifier_desc:0 "Mild diplomacy and prestige while intensity is Low."
 sd_diplo_med_modifier:0 "Diplomat Presence (Mid)"
 sd_diplo_med_modifier_desc:0 "Solid diplomacy and prestige while intensity is Mid."
 sd_diplo_high_modifier:0 "Diplomat Presence (High)"
 sd_diplo_high_modifier_desc:0 "Strong diplomacy and prestige while intensity is High. Major asks auto-accept."
 sd_federation_prestige_faucet_modifier:0 "Federation Prestige"
 sd_federation_prestige_faucet_modifier_desc:0 "Mild monthly prestige while you keep at least one bound client at Mid/High intensity."
 sd_charmed_court_modifier:0 "Charmed Court"
 sd_charmed_court_modifier_desc:0 "This court is charmed by a Supreme Diplomat. Vanilla diplomacy asks stick more easily. Charm — not intimidation, not hooks."
 sd_tributary_client_modifier:0 "Diplomat Tributary"
 sd_tributary_client_modifier_desc:0 "Independent client paying yearly tribute to a Supreme Diplomat. Soft pressure against joining wars against the overlord."
 sd_tributary_overlord_modifier:0 "Tributary Overlord"
 sd_tributary_overlord_modifier_desc:0 "You collect tribute from bound independent clients."
 sd_marriage_pact_modifier:0 "Marriage Pact"
 sd_marriage_pact_modifier_desc:0 "A lasting diplomatic marriage pact sealed by a Supreme Diplomat."
 sd_defensive_pact_modifier:0 "Defensive Pact"
 sd_defensive_pact_modifier_desc:0 "A lighter Low-intensity defensive understanding sealed by a Supreme Diplomat."

 # Opinions
 sd_offered_vassalage_opinion:0 "Offered Vassalage"
 sd_tributary_bond_opinion:0 "Tributary Bond"
 sd_sealed_alliance_opinion:0 "Sealed Alliance"
 sd_marriage_pact_opinion:0 "Marriage Pact"
 sd_charmed_by_diplomat_opinion:0 "Charmed"
 sd_realm_invite_opinion:0 "Realm Invite"
 sd_summit_guest_opinion:0 "Summit Guest"

 # Decisions
 sd_embrace_supreme_diplomat_decision:0 "Embrace Supreme Diplomat"
 sd_embrace_supreme_diplomat_decision_desc:0 "Accept the mantle of Supreme Diplomat. Offer vassalage, bind tributaries, seal alliances and marriage pacts, sway courts, and invite small realms into your federation."
 sd_embrace_supreme_diplomat_decision_tooltip:0 "Gain the Supreme Diplomat trait and High-intensity diplomacy package"
 sd_embrace_supreme_diplomat_decision_confirm:0 "Embrace Diplomat"
 sd_embrace_supreme_diplomat_decision_effect_tt:0 "You become a Supreme Diplomat"

 sd_renounce_supreme_diplomat_decision:0 "Renounce Supreme Diplomat"
 sd_renounce_supreme_diplomat_decision_desc:0 "Lay down the Supreme Diplomat mantle. Intensity modifiers and diplomacy verbs go with it."
 sd_renounce_supreme_diplomat_decision_tooltip:0 "Remove the Supreme Diplomat trait and modifiers"
 sd_renounce_supreme_diplomat_decision_confirm:0 "Renounce"
 sd_renounce_supreme_diplomat_decision_effect_tt:0 "You lose Supreme Diplomat"

 sd_manage_supreme_diplomat_decision:0 "Manage Supreme Diplomat"
 sd_manage_supreme_diplomat_decision_desc:0 "Review intensity, module toggles, and federation clients. Two pages — Done stays on top. Cycle options show the current value before flipping. Peaceful twin of Extra Conquests; soft peer to Schemes (no hooks)."
 sd_manage_supreme_diplomat_decision_tooltip:0 "Open the Supreme Diplomat settings hub"
 sd_manage_supreme_diplomat_decision_confirm:0 "Open Hub"
 sd_manage_supreme_diplomat_decision_effect_tt:0 "Opens the Supreme Diplomat manage hub"

 # Decision group
 decision_group_type_sd_diplomat:0 "Supreme Diplomat"

 # Interactions
 sd_grant_supreme_diplomat_interaction:0 "Grant Supreme Diplomat"
 sd_grant_supreme_diplomat_interaction_desc:0 "Bestow the Supreme Diplomat mantle on a child or grandchild. Available when the granting rule allows targets."

 sd_revoke_supreme_diplomat_interaction:0 "Revoke Supreme Diplomat"
 sd_revoke_supreme_diplomat_interaction_desc:0 "Strip [recipient.GetShortUIName] of the Supreme Diplomat honor."

 sd_offer_vassalage_interaction:0 "Offer Vassalage"
 sd_offer_vassalage_interaction_desc:0 "Invite this independent ruler to kneel and become your vassal while keeping their titles. At High intensity they auto-accept — no vanilla refuse wall. Gold and prestige sweeteners scale with intensity. Soft peer: alternate peaceful route vs Supreme Sovereign Extra Conquests."
 sd_offer_vassalage_interaction_extra_icon:0 "$sd_offer_vassalage_interaction$"

 sd_demand_tributary_interaction:0 "Demand Tributary"
 sd_demand_tributary_interaction_desc:0 "Demand that this independent ruler become your tributary. They stay independent, pay yearly gold, and hesitate to war you. Softer than Offer Vassalage. High auto-accept."

 sd_offer_tributary_interaction:0 "Offer Tributary"
 sd_offer_tributary_interaction_desc:0 "Offer a softer client bond: [recipient.GetShortUIName] stays independent and pays yearly tribute. Same effect family as Demand Tributary with friendlier framing."

 sd_release_tributary_interaction:0 "Release Tributary"
 sd_release_tributary_interaction_desc:0 "Release [recipient.GetShortUIName] from the tributary bond."

 sd_seal_alliance_interaction:0 "Seal Alliance"
 sd_seal_alliance_interaction_desc:0 "Instant alliance seal without marriage grind. Mid/High create a full alliance; Low creates a defensive pact understanding. High auto-accept."

 sd_seal_house_alliances_interaction:0 "Seal House Alliances"
 sd_seal_house_alliances_interaction_desc:0 "As house head, pack-seal alliances with dynasty independents first, then neighboring house heads, up to the intensity cap (2/3/5). Also available from the manage hub."

 sd_marriage_pact_interaction:0 "Marriage Pact"
 sd_marriage_pact_interaction_desc:0 "Arrange betrothal or marriage (auto-picking close kin if needed), seal an alliance, and apply a lasting opinion pact. Skips usual AI refusal theater while Diplomat is active. Does not grant hooks."

 sd_supreme_sway_interaction:0 "Supreme Sway"
 sd_supreme_sway_interaction_desc:0 "Charm [recipient.GetShortUIName]'s court so vanilla diplomacy asks stick. Charm — not Death Stare intimidation, not Supreme Schemes hooks."

 sd_invite_realm_interaction:0 "Invite Realm"
 sd_invite_realm_interaction_desc:0 "Peacefully invite a small independent realm's top liege under you while keeping their vassal tree. Stricter size and cost than Offer Vassalage. Hidden at Low. High auto-accept. No war, no Realm Annex CB."

 # Tooltips
 sd_tt_can_embrace:0 "You may embrace Supreme Diplomat"
 sd_tt_can_receive_diplomat:0 "They may receive Supreme Diplomat"
 sd_tt_high_auto_accept:0 "High intensity: auto-accept"
 sd_tt_can_offer_vassalage:0 "You are a Supreme Diplomat with Vassalage On, off cooldown, and can afford the sweetener"
 sd_tt_independent_valid:0 "Independent landed ruler — not already your vassal"
 sd_tt_can_demand_tributary:0 "You are a Supreme Diplomat with Tributary On and off cooldown"
 sd_tt_can_seal_alliance:0 "You are a Supreme Diplomat with Alliance On and off cooldown"
 sd_tt_not_already_allied:0 "Not already allied"
 sd_tt_can_seal_house_alliances:0 "You are a house-head Supreme Diplomat with Alliance On and off cooldown"
 sd_tt_can_marriage_pact:0 "You are a Supreme Diplomat with Marriage On and off cooldown"
 sd_tt_can_supreme_sway:0 "You are a Supreme Diplomat with Sway On and off cooldown"
 sd_tt_can_invite_realm:0 "You are a Supreme Diplomat with Realm Invite On at Mid/High, off cooldown, and can afford the cost"
 sd_tt_small_independent_realm:0 "Independent top liege of a small realm within the intensity size cap"

