 # Settings hub
 sd_settings.1001.t:0 "Supreme Diplomat — Hub"
 sd_settings.1001.desc_intro:0 "Federation desk. Cycle a lever to flip it; Done stays on top.\n"
 sd_settings.1001.desc_federation:0 "Bound clients (vassals/tributaries/allies sealed via Diplomat) feed a mild Mid/High prestige faucet. Mass Sway and House Seal are on page 2.\n"
 sd_settings.1001.desc_footer:0 "Soft peers: SS Extra Conquests stay available; SSC hooks are never granted; EA buffs vassals you already have.\n"
 sd_settings.1001.close:0 "Done"
 sd_settings.1001.more:0 "More…"
 sd_settings.1001.back:0 "Back"
